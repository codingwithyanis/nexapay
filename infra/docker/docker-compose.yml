services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexapay
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay
    ports:
      - "5432:5432"
    volumes:
      - nexapay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  nexapay-postgres-data:
